name = "mangerbackend"
main = "src/index.js"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]

[vars]
DEFAULT_CURRENCY = "EGP"

[secrets]
required = ["DATABASE_URL"]

# Branch previews receive only a harmless default; never copy DATABASE_URL here.
[previews.vars]
DEFAULT_CURRENCY = "EGP"
