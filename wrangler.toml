name = "mangerbackend"
main = "src/index.js"
compatibility_date = "2026-10-08"
compatibility_flags = ["nodejs_compat"]

[vars]
DEFAULT_CURRENCY = "EGP"

[secrets]
required = ["DATABASE_URL", "ADMIN_JWT_SECRET"]

# Branch previews receive no production database credentials or signing secret.
[previews.vars]
DEFAULT_CURRENCY = "EGP"
