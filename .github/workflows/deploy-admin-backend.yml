name: Deploy Mange admin backend

on:
  workflow_dispatch:
    inputs:
      apply_admin_migration:
        description: Apply Mange admin, employee, governorate and Firebase Google authentication migrations before deploying
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-mangerbackend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy mangerbackend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and build
        run: |
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
          npm run build

      - name: Check required secret names are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_PUBLIC_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_PUBLIC_SERVICE_ACCOUNT_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in DATABASE_URL ADMIN_JWT_SECRET FCM_SERVICE_ACCOUNT_JSON FCM_PUBLIC_SERVICE_ACCOUNT_JSON CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Check direct Neon migration URL
        if: ${{ inputs.apply_admin_migration }}
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          if [[ -z "${DATABASE_MIGRATION_URL:-}" ]]; then
            echo "::error::Missing GitHub Actions secret: DATABASE_MIGRATION_URL"
            exit 1
          fi

      - name: Apply Mange admin database migration
        if: ${{ inputs.apply_admin_migration }}
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f migrations/0001_admin_platform.sql
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f migrations/0002_admin_auth_governorates.sql
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f migrations/0003_firebase_google_admin_auth.sql

      - name: Ensure notification image KV namespace and deployment config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          account_id = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          base = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/storage/kv/namespaces'

          def api(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get('success'):
                  raise RuntimeError('Cloudflare KV API request was unsuccessful')
              return result

          namespaces = api('GET', base).get('result', [])
          matches = [item for item in namespaces if item.get('title') == 'mange-notification-images']
          if matches:
              namespace_id = matches[0]['id']
          else:
              created = api('POST', base, {'title': 'mange-notification-images'})
              namespace_id = created.get('result', {}).get('id')
          if not namespace_id or not all(character in '0123456789abcdef-' for character in namespace_id.lower()):
              raise RuntimeError('Cloudflare returned an invalid KV namespace id')

          config = Path('wrangler.toml').read_text(encoding='utf-8').rstrip()
          config += f'\n\n[[kv_namespaces]]\nbinding = "NOTIFICATION_IMAGES"\nid = "{namespace_id}"\n'
          Path('.wrangler.deploy.toml').write_text(config, encoding='utf-8')
          print('Cloudflare KV namespace is ready and bound for deployment.')
          PY

      - name: Deploy Worker code
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config .wrangler.deploy.toml

      - name: Upload runtime secrets after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_PUBLIC_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_PUBLIC_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('/tmp/mangerbackend-runtime-secrets.json', 'w', encoding='utf-8') as handle:
              json.dump({name: os.environ[name] for name in ('DATABASE_URL', 'ADMIN_JWT_SECRET', 'FCM_SERVICE_ACCOUNT_JSON', 'FCM_PUBLIC_SERVICE_ACCOUNT_JSON')}, handle)
          PY
          npx --no-install wrangler versions secret bulk /tmp/mangerbackend-runtime-secrets.json --config .wrangler.deploy.toml
          rm -f /tmp/mangerbackend-runtime-secrets.json

      - name: Integration test — verify Firebase Google auth route
        run: node scripts/check-firebase-google-auth-ci.js
