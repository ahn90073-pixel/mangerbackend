name: Send requested public token
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send through backend FCM layer
        env:
          FCM_PUBLIC_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_PUBLIC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/send-requested-public-token.mjs
