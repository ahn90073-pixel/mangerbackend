name: Run backend notification test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run backend notification
        env:
          FCM_PUBLIC_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_PUBLIC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/run-backend-notification.mjs
