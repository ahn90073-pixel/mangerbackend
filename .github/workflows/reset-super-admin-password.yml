name: Reset Mange super-admin password

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-mange-super-admin-password
  cancel-in-progress: false

jobs:
  reset-password:
    name: Reset the active super-admin password
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reset password and revoke existing sessions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          for name in DATABASE_URL INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          node scripts/reset-super-admin-ci.js
