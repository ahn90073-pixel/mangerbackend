name: Check Mange super-admin login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-login:
    name: Check the configured admin credentials
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test login without logging credentials or token
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: node scripts/check-super-admin-login-ci.js
